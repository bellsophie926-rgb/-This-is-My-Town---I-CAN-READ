    &lt;style&gt;
        :root {
            --primary: #FF8C42;
            --primary-light: #FFF1E6;
            --secondary: #27AE60;
            --accent: #3498DB;
            --bg: #FFF8F0;
            --text: #2C3E50;
        }
        body {
            font-family: 'Comic Sans MS', 'PingFang SC', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }
        .section-title {
            position: relative;
            display: inline-block;
            padding-bottom: 0.5rem;
        }
        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 2px;
        }
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .flashcard-container {
            perspective: 1000px;
            height: 260px;
        }
        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }
        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 1.5rem;
            padding: 1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 2px solid #fff;
        }
        .flashcard-front {
            background-color: white;
        }
        .flashcard-back {
            background-color: var(--primary-light);
            transform: rotateY(180deg);
        }
        .flashcard-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            margin-bottom: 0.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .speaker-btn {
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 0.5rem;
            border-radius: 9999px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
        }
        .speaker-btn:hover {
            background-color: var(--primary);
            color: white;
            transform: scale(1.1);
        }
        .speaker-btn svg {
            width: 20px;
            height: 20px;
        }
        .book-container {
            background: white;
            border-radius: 2rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .page-img-container {
            height: 450px;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .page-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .nav-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .nav-btn:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.1);
        }
        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .progress-bar {
            height: 6px;
            background: #eee;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--secondary);
            transition: width 0.3s ease;
        }
        .highlight-word {
            color: var(--primary);
            font-weight: bold;
            cursor: pointer;
            border-bottom: 2px dashed var(--primary-light);
        }
        .highlight-word:hover {
            background-color: var(--primary-light);
        }
    &lt;/style&gt;

            { en: &quot;the whole&quot;, zh: &quot;整个&quot;, img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/4wjcsoNUV9iaXXZCv4DGWF.jpg&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/UNjR6iW9E9KcYjcXR2uxCd.mp3&quot; },
            { en: &quot;world&quot;, zh: &quot;世界&quot;, img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/r9JQuEevPE3Bg9UTm7tgSh.jpg&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/iw2VFkXfTg38YGuwnNVbHi.mp3&quot; },
            { en: &quot;put out&quot;, zh: &quot;扑灭&quot;, img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/8mVqSLEEBe2xKZ6RMk2c9g.jpg&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/9TapyNXFGduufqowizNt96.mp3&quot; }
        ];

        const storyPages = [
            { img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/jJQX8T23f9Xih7WndrkdFF.jpg&quot;, text: &quot;This is my town. This is where I live. These are the people in my town. They live here, too.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/z8u9AgBe4X7beFNsqqMZzR.mp3&quot; },
            { img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/HtbNak7Xa9C4Qkh6ptr5Eh.jpg&quot;, text: &quot;This is our post office. The mail comes in here. I come here to mail letters.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/QZxCPFhk8CFD5MV9mtSx54.mp3&quot; },
            { img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/9FEGuSnjDNTVVDC8qPpYE5.jpg&quot;, text: &quot;This is our fire station. The fire truck lives here. Oo! Ee! Oo! go the sirens. When there is a fire, the firemen go to it. They put the fire out.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/igbR9u4jUqEqxDvfwNmKhh.mp3&quot; },
            { img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/5dwvMGHHmxJX72h8WSkv9V.jpg&quot;, text: &quot;This is our police station. Police officers work here. They keep our town safe.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/mZJ9QkJasK8hCH8T7ypneJ.mp3&quot; },
            { img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/BvmfTcW9HdJjy2iXNx633b.jpg&quot;, text: &quot;This is our diner. Sometimes we come here for lunch. Yum!&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/NVpq9kAUkAQ98GecGsinQN.mp3&quot; },
            { img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/F9NXWwqrBbeFLk9YR2stFn.jpg&quot;, text: &quot;This is our town hall. Our mayor works here. Sometimes we have parades in our town.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/jb7ZPaKdx3LBKHZYU2YPjF.mp3&quot; },
            { img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/k3AMrSJNJuc9btW5yw6bbB.jpg&quot;, text: &quot;This is our library. I come here to find books to read. During story hour, the librarian reads to us. But when story hour is over we have to be quiet.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/mkrium2bMp8ygEmbBmnTsH.mp3&quot; },
            { img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/cVPyBSy2MXRRopWs9Wt99k.jpg&quot;, text: &quot;This is our movie theater. I can buy my own ticket. I like to get popcorn. I am always extra careful.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/gjjDWd9QHEKAvVzibp4gGd.mp3&quot; },
            { img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/ctpFdcm5v97Xc6YpXg7osR.jpg&quot;, text: &quot;We play football here. This is our bakery. It has the best cupcakes.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/2B8R2SYvjodz4BLadnLb6W.mp3&quot; },
            { img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/viYzm7fjquTqc7G7QGumyP.jpg&quot;, text: &quot;This is the office of our town newspaper. It is a busy place. Look! Last week my picture was in the paper.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/sgDbRfJCJtXDgXhxVDSxRN.mp3&quot; },
            { img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/jJQX8T23f9Xih7WndrkdFF.jpg&quot;, text: &quot;I love my town. It is the nicest place in the whole world.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/gdtZgMtKLQNKPLtHAZrPWb.mp3&quot; }
        ];

        let currentPage = 0;
        const audioPlayer = new Audio();

        function init() {
            renderSightWords();
            renderNewWords();
            updatePage();
        }

        function renderSightWords() {
            const container = document.getElementById('hf-words-container');
            container.innerHTML = hfWords.map(item =&gt; `
                &lt;div class=&quot;bg-white p-4 rounded-2xl border border-amber-100 card-hover text-center cursor-pointer flex flex-col items-center gap-2&quot; onclick=&quot;playAudio('${item.audio}')&quot;&gt;
                    &lt;span class=&quot;text-xl font-medium&quot;&gt;${item.word}&lt;/span&gt;
                    &lt;div class=&quot;speaker-btn&quot;&gt;
                        &lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;polygon points=&quot;11 5 6 9 2 9 2 15 6 15 11 19 11 5&quot;&gt;&lt;/polygon&gt;&lt;path d=&quot;M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.08&quot;&gt;&lt;/path&gt;&lt;/svg&gt;
                    &lt;/div&gt;
                &lt;/div&gt;
            `).join('');
        }

        function renderNewWords() {
            const container = document.getElementById('new-words-container');
            container.innerHTML = newWords.map((item, index) =&gt; `
                &lt;div class=&quot;flashcard-container&quot;&gt;
                    &lt;div class=&quot;flashcard&quot; id=&quot;card-${index}&quot; onclick=&quot;toggleCard(${index})&quot;&gt;
                        &lt;div class=&quot;flashcard-front&quot;&gt;
                            &lt;div class=&quot;text-2xl font-bold text-primary mb-4&quot;&gt;${item.en}&lt;/div&gt;
                            &lt;button class=&quot;speaker-btn mb-4&quot; onclick=&quot;event.stopPropagation(); playAudio('${item.audio}')&quot;&gt;
                                &lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;polygon points=&quot;11 5 6 9 2 9 2 15 6 15 11 19 11 5&quot;&gt;&lt;/polygon&gt;&lt;path d=&quot;M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.08&quot;&gt;&lt;/path&gt;&lt;/svg&gt;
                            &lt;/button&gt;
                            &lt;div class=&quot;text-gray-400 text-xs&quot;&gt;点击翻转&lt;/div&gt;
                        &lt;/div&gt;
                        &lt;div class=&quot;flashcard-back&quot;&gt;
                            &lt;img src=&quot;${item.img}&quot; class=&quot;flashcard-img&quot; alt=&quot;${item.en}&quot;&gt;
                            &lt;div class=&quot;text-xl font-bold text-primary mb-2&quot;&gt;${item.zh}&lt;/div&gt;
                            &lt;button class=&quot;speaker-btn&quot; onclick=&quot;event.stopPropagation(); playAudio('${item.audio}')&quot;&gt;
                                &lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;polygon points=&quot;11 5 6 9 2 9 2 15 6 15 11 19 11 5&quot;&gt;&lt;/polygon&gt;&lt;path d=&quot;M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.08&quot;&gt;&lt;/path&gt;&lt;/svg&gt;
                            &lt;/button&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                &lt;/div&gt;
            `).join('');
        }

        function toggleCard(index) {
            document.getElementById(`card-${index}`).classList.toggle('is-flipped');
        }

        function playAudio(url) {
            audioPlayer.src = url;
            audioPlayer.play();
        }

        function updatePage() {
            const page = storyPages[currentPage];
            document.getElementById('current-page-img').src = page.img;
            document.getElementById('page-number').textContent = `Page ${currentPage + 1} / ${storyPages.length}`;
            
            // 标记 Part 2 词汇并设置点击发音
            document.getElementById('story-text').innerHTML = highlightPart2Words(page.text);
            document.getElementById('progress-fill').style.width = `${((currentPage + 1) / storyPages.length) * 100}%`;
            
            document.getElementById('prev-btn').disabled = currentPage === 0;
            document.getElementById('next-btn').disabled = currentPage === storyPages.length - 1;
        }

        function highlightPart2Words(text) {
            // 获取所有 Part 2 词汇并按长度降序排列
            const wordsToHighlight = newWords.map(item =&gt; item.en).sort((a, b) =&gt; b.length - a.length);
            if (wordsToHighlight.length === 0) return text;

            // 构建一个单一的正则表达式，匹配所有关键词，这样可以避免嵌套替换
            // 对单词进行转义以处理可能的特殊字符
            const pattern = wordsToHighlight
                .map(w =&gt; w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&amp;'))
                .join('|');
            
            // 使用 \b 确保匹配完整单词，gi 表示全局和不区分大小写
            const regex = new RegExp(`\\b(${pattern})\\b`, 'gi');
            
            // 一次性替换，不会处理已经生成的 HTML 标签内部内容
            return text.replace(regex, (match) =&gt; {
                return `&lt;span class=&quot;highlight-word&quot; onclick=&quot;speakWord('${match}')&quot;&gt;${match}&lt;/span&gt;`;
            });
        }

        function changePage(delta) {
            currentPage += delta;
            updatePage();
            // 用户要求点击才开始，所以这里移除自动播放
            // playCurrentPageAudio(); 
        }

        function playCurrentPageAudio() {
            playAudio(storyPages[currentPage].audio);
        }

        function speakWord(word) {
            // 统一转小写匹配
            const searchWord = word.toLowerCase();
            const found = [...hfWords, ...newWords].find(i =&gt; (i.word || i.en).toLowerCase() === searchWord);
            
            if (found &amp;&amp; found.audio) {
                playAudio(found.audio);
            } else {
                // 如果没找到精确匹配（比如复数或时态变化），尝试模糊匹配或使用 TTS
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.7; // 语速也调慢
                window.speechSynthesis.speak(utterance);
            }
        }

        window.onload = init;
    &lt;/script&gt;

  <script>

    function getIsMobile() {
      const width = document.documentElement.clientWidth
      const isMobile = /Android|webOS|iPhone|iPod|BlackBerry|iPad|Windows Phone|Mobile/i.test(navigator.userAgent) || width <= 768
      return isMobile
    }

    // 打开飞象老师官网
    function openFeixiangTeacher(event) {
      const isMobile = getIsMobile()

      // 判断是否为移动端浏览器
      if (isMobile) {
        // 移动端不跳转
        return
      }
      window.open('https://www.feixianglaoshi.com', '_blank')
    }


    // ==================== 埋点相关代码 ====================

    /**
     * 页面停留时长统计
     */
    (function () {
      let startTime = null
      let totalTime = 0
      let reportTimer = null // 防抖定时器

      // 开始计时
      function startTimer() {
        if (!startTime) {
          startTime = Date.now()
          console.log('[埋点] 开始计时')
        }
      }

      // 停止计时并累加时长
      function stopTimer() {
        if (startTime) {
          totalTime += Date.now() - startTime
          startTime = null
          console.log('[埋点] 停止计时，累计时长:', Math.floor(totalTime / 1000), '秒')
        }
      }

      // 检查页面是否真正可见
      function isPageVisible() {
        // 检查 document.hidden
        if (document.hidden) {
          return false
        }

        // 检查 document.visibilityState
        if (document.visibilityState && document.visibilityState !== 'visible') {
          return false
        }

        // 检查窗口是否有焦点
        if (!document.hasFocus()) {
          return false
        }

        return true
      }

      // 上报停留时长（带防抖）
      function reportStayTime(eventType, immediate = false) {
        stopTimer()

        // 清除之前的定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 如果是立即上报（如页面卸载），不使用防抖
        if (immediate) {
          doReport(eventType)
          return
        }

        // 使用防抖，避免短时间内多次上报
        // 100ms 内如果有多个事件触发，只上报最后一次
        reportTimer = setTimeout(function () {
          doReport(eventType)
          reportTimer = null
        }, 100)
      }

      // 实际执行上报
      function doReport(eventType) {
        if (window.frog && totalTime > 0) {
          const serverData = window.__SERVER_DATA__ || {}
          const chatId = serverData.watermarkChatId
          window.frog.add({
            url: '/time/HtmlPage/enter',
            eventId: 42818,
            customExtend: {
              chat_id: chatId,
              use_time: Math.floor(totalTime / 1000), // 转换为秒
            },
            duration: Math.floor(totalTime / 1000), // 转换为秒,
            currentPage: 'HtmlPage',
            eventAction: 'time',
            eventName: 'enter'
          })
          console.log(`[埋点] 页面停留时长上报 (${eventType}):`, Math.floor(totalTime / 1000), '秒')

          // 上报后重置累计时长，为下次统计做准备
          totalTime = 0
        }
      }

      // 清理函数：移除所有事件监听器
      function cleanup() {
        console.log('[埋点] 清理计时器资源')

        // 清除防抖定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 移除事件监听器
        document.removeEventListener('visibilitychange', handleVisibilityChange)
        window.removeEventListener('blur', handleBlur)
        window.removeEventListener('focus', handleFocus)
        window.removeEventListener('beforeunload', handleBeforeUnload)
        window.removeEventListener('pagehide', handlePageHide)

        // 重置变量
        startTime = null
        totalTime = 0
      }

      // 事件处理函数（需要命名以便移除）
      function handleVisibilityChange() {
        if (document.hidden) {
          // 页面不可见，停止计时并上报
          console.log('[埋点] visibilitychange - 页面隐藏')
          reportStayTime('visibilitychange')
        } else {
          // 页面可见，开始新的计时
          console.log('[埋点] visibilitychange - 页面显示，开始新的计时')
          startTimer()
        }
      }

      function handleBlur() {
        // 窗口失去焦点，停止计时并上报
        console.log('[埋点] blur - 窗口失去焦点')
        reportStayTime('blur')
      }

      function handleFocus() {
        // 窗口获得焦点，开始新的计时
        console.log('[埋点] focus - 窗口获得焦点，开始新的计时')
        startTimer()
      }

      function handleBeforeUnload() {
        // 页面卸载前立即上报（不使用防抖）
        console.log('[埋点] beforeunload - 页面即将卸载')
        reportStayTime('beforeunload', true)
        cleanup()
      }

      function handlePageHide() {
        // 页面隐藏时立即上报（iOS Safari 更可靠，不使用防抖）
        console.log('[埋点] pagehide - 页面隐藏')
        reportStayTime('pagehide', true)
      }

      function handleDOMContentLoaded() {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 监听页面可见性变化
      document.addEventListener('visibilitychange', handleVisibilityChange)

      // 监听窗口失去/获得焦点
      window.addEventListener('blur', handleBlur)
      window.addEventListener('focus', handleFocus)

      // 页面加载完成后开始计时
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', handleDOMContentLoaded)
      } else {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 页面卸载时上报
      window.addEventListener('beforeunload', handleBeforeUnload)

      // 兼容性：监听 pagehide 事件（iOS Safari 更可靠）
      window.addEventListener('pagehide', handlePageHide)
    })()

    /**
     * 点击飞象老师 Logo 的埋点
     */
    function trackLogoClick(event) {
      // 阻止事件冒泡，避免触发 HTML 点击埋点
      event.stopPropagation()

      if (window.frog) {
        const serverData = window.__SERVER_DATA__ || {}
        const chatId = serverData.watermarkChatId
        console.log('trackHtmlClick', chatId)

        window.frog.add({
          url: '/click/HtmlPage/logo',
          eventId: 42816,
          customExtend: {
            chat_id: chatId,
          },
          currentPage: 'HtmlPage',
          eventAction: 'click',
          eventName: 'logo'
        })

        console.log('[埋点] 点击飞象老师 Logo')
      }
    }

    /**
     * 点击立即体验的埋点
     */
    function trackStartButtonClick(event) {
      // 阻止事件冒泡，避免触发 HTML 点击埋点
      event.stopPropagation()

      if (window.frog) {
        const serverData = window.__SERVER_DATA__ || {}
        const chatId = serverData.watermarkChatId
        console.log('trackHtmlClick', chatId)
        window.frog.add({
          url: '/click/HtmlPage/start',
          eventId: 42817,
          customExtend: {
            chat_id: chatId
          },
          currentPage: 'HtmlPage',
          eventAction: 'click',
          eventName: 'start'
        })
        console.log('[埋点] 点击立即体验')
      }
    }

    // 绑定点击事件
    document.addEventListener('DOMContentLoaded', function () {
      // 绑定 Logo 点击埋点和跳转功能
      const logoElement = document.querySelector('.left-watermark-content')
      if (logoElement) {
        logoElement.addEventListener('click', function (event) {
          trackLogoClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定立即体验按钮点击埋点和跳转功能
      const startButton = document.querySelector('.jump-button')
      if (startButton) {
        startButton.addEventListener('click', function (event) {
          trackStartButtonClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定水印覆盖层点击（整体区域）
      const watermarkOverlay = document.querySelector('.watermark-overlay')
      if (watermarkOverlay) {
        watermarkOverlay.addEventListener('click', function (event) {
          // 如果点击的不是 logo 或按钮，则触发跳转
          const target = event.target
          const isLogo = target.closest('.left-watermark-content')
          const isButton = target.closest('.jump-button')

          if (!isLogo && !isButton) {
            openFeixiangTeacher(event)
          }
        })
      }
    })

    // ==================== 原有功能代码 ====================

    function adjustRem() {
      const pcBaseWidth = 375 // 设计稿
      const width = document.documentElement.clientWidth
      document.documentElement.style.fontSize = `${(width / pcBaseWidth * 100).toFixed(2)}px`
    }


    // 移动端检测和按钮隐藏逻辑
    function checkAndHideButtonOnMobile() {
      const isMobile = getIsMobile()
      if (isMobile) {
        adjustRem()
      }
      const jumpButton = document.querySelector('.right-watermark-content .jump-button');
      const iframeContainer = document.querySelector('.iframe-container');

      if (isMobile && jumpButton) {
        jumpButton.style.display = 'none';
      } else {
        jumpButton.style.display = 'flex'
      }

      // 移动端时给iframe-container添加类名，否则移除类名
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }


    function handleResize() {
      // 响应式处理：重新检测移动端并处理按钮显示/隐藏
      checkAndHideButtonOnMobile();

      // 在窗口大小变化时，重新应用移动端相关的逻辑
      const isMobile = getIsMobile()
      const watermarkOverlay = document.querySelector('.watermark-overlay');
      const iframeContainer = document.querySelector('.iframe-container');

      // 根据当前设备类型调整水印覆盖层的点击行为
      if (watermarkOverlay) {
        if (isMobile) {
          // 移动端：移除点击事件或设置为空函数
          watermarkOverlay.onclick = function () {
            // 移动端不执行跳转
            return;
          };
        } else {
          // 桌面端：恢复正常的点击跳转功能
          watermarkOverlay.onclick = openFeixiangTeacher;
        }
      }

      // 确保在resize时也能正确添加或移除mobile类
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }

    // 防止iframe内容溢出
    window.addEventListener('resize', handleResize);

    // 页面加载完成后执行移动端检测
    document.addEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);

    // 清理所有事件绑定的函数
    function clearAllEvents() {
      // 清除 resize 事件监听器
      window.removeEventListener('resize', handleResize);

      // 清除 DOMContentLoaded 事件监听器
      document.removeEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);
    }

    // 页面卸载时自动清理事件（可选）
    window.addEventListener('beforeunload', clearAllEvents);

  </script>
